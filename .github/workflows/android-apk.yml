name: Android APK

on:
  push:
    branches:
      - main
    paths:
      - "App.js"
      - "app.json"
      - "eas.json"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "assets/**"
      - "scripts/prepare-build-version.js"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK with EAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare build version
        run: npm run version:build

      - name: Build APK
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: eas build --platform android --profile preview --non-interactive --wait
